services:
  # Reverse-proxy service
  traefik:
    image: traefik:v3.7.16
    container_name: traefik
    command:
      # Debug logging
      # - '--log.level=DEBUG'
      # Keep track of users accessing the application
      - '--accesslog=true'
      - '--accesslog.fields.names.ClientHost=keep'
      - '--accesslog.fields.names.Authorization=drop'
      - '--accesslog.fields.names.User-Agent=keep'
      - '--accesslog.fields.names.RequestHost=keep'
      - '--accesslog.fields.names.ClientUsername=keep'
      - '--accesslog.fields.names.Headers.X-Auth-Request-Email=keep'
      # Dashboard is served on the internal `traefik` entrypoint (:8080), which is only
      # published on the host's loopback interface; reach it via `tailscale serve`
      - '--api.dashboard=true'
      - '--api.insecure=true'
      # Expose metrics to Prometheus (scraped by Alloy on internal_metrics network)
      - '--metrics.prometheus=true'
      - '--metrics.prometheus.entrypoint=metrics'
      - '--entrypoints.metrics.address=:8082'
      # Enable ping endpoint for healthcheck
      - '--ping=true'
      # HTTPS only
      - '--entrypoints.websecure.address=:443'
      # Drop request headers that alias another header (e.g. X_Auth_Request_User vs
      # X-Auth-Request-User) so clients can't smuggle values past ForwardAuth's
      # authResponseHeaders
      - '--entrypoints.websecure.http.aliasHeadersStrategy=delete'
      # Security headers on every response (defined in the file provider)
      - '--entrypoints.websecure.http.middlewares=security-headers@file'
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      # Enable for docker but only if they have the right labels. The Docker API is
      # reached through the read-only socket proxy rather than the raw socket.
      - '--providers.docker=true'
      - '--providers.docker.endpoint=tcp://socket-proxy:2375'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=web'
      # Cloudflare DNS settings
      - '--certificatesresolvers.cloudflare.acme.dnschallenge=true'
      - '--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare'
      - '--certificatesresolvers.cloudflare.acme.email=${CLOUDFLARE_API_EMAIL}'
      - '--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json'
      # Only trust X-Forwarded-* headers from Cloudflare. This does not block other
      # sources from connecting; the host firewall must restrict :443 to Cloudflare.
      - '--entrypoints.websecure.forwardedHeaders.trustedIPs=${CLOUDFLARE_TRUSTED_IPS}'
    ports:
      - '443:443'
      # Dashboard/API: loopback only
      - '127.0.0.1:8080:8080'
    volumes:
      - './traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro'
      # Ensure this file has 600 permissions
      - './acme.json:/letsencrypt/acme.json'
    networks:
      - web
      - internal_metrics
      - socket_proxy
    depends_on:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - CF_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/ping']
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # Provide Google OAuth services for other containers
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: oauth2-proxy
    command:
      - --cookie-domain=.jamesmassucco.com
    environment:
      # Provider (Google) settings
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_AUTHENTICATED_EMAILS: ${OAUTH2_AUTHORIZED_EMAILS}
      OAUTH2_PROXY_REDIRECT_URL: https://oauth.jamesmassucco.com/oauth2/callback
      # Cookie / session settings
      OAUTH2_PROXY_COOKIE_SECRET: ${GOOGLE_OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAIN: .jamesmassucco.com
      OAUTH2_PROXY_COOKIE_SECURE: true
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # Login flow
      OAUTH2_PROXY_SIGN_IN_PAGE: auto
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: true
      OAUTH2_PROXY_WHITELIST_DOMAINS: .jamesmassucco.com
      # Headers and forwarding
      OAUTH2_PROXY_SET_XAUTHREQUEST: true
      OAUTH2_PROXY_REVERSE_PROXY: true
      # Networking
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Upstream target
      OAUTH2_PROXY_UPSTREAMS: static://200
      # Logging (never show debug details on public error pages)
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: false
      # OAUTH2_PROXY_LOG_LEVEL: debug
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.oauth.rule=Host(`oauth.jamesmassucco.com`)
      - traefik.http.routers.oauth.entrypoints=websecure
      - traefik.http.routers.oauth.tls.certresolver=cloudflare
      - traefik.http.services.oauth.loadbalancer.server.port=4180
      # Shared middlewares referenced by other services' routers. Defined here so that
      # if oauth2-proxy is down, protected routers fail closed instead of going unauthenticated.
      - traefik.http.middlewares.ratelimit.ratelimit.average=50
      - traefik.http.middlewares.ratelimit.ratelimit.burst=100
      - traefik.http.middlewares.oauth-auth.forwardauth.address=https://oauth.jamesmassucco.com/
      - traefik.http.middlewares.oauth-auth.forwardauth.trustForwardHeader=true
      - traefik.http.middlewares.oauth-auth.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # oauth2-proxy image is minimal (no wget/curl); --version exits 0 immediately,
      # confirming the binary is functional. The HTTP /ping endpoint cannot be
      # reached from within the container without shell HTTP tools.
      test: ['CMD', '/bin/oauth2-proxy', '--version']
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Read-only Docker API for Traefik and Alloy, so neither mounts the raw socket
  # (which would be root on the host). Only reachable on the internal socket_proxy network.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket-proxy
    environment:
      POST: 0
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Basic whoami service, useful for debugging network configuration
  whoami:
    image: traefik/whoami:v1.12.0
    container_name: whoami
    networks:
      - web
    labels:
      # Use traefik to provide HTTPS endpoint
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.jamesmassucco.com`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls.certresolver=cloudflare
      # Use rate-limiting and OAuth
      - traefik.http.routers.whoami.middlewares=oauth-auth,ratelimit
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # whoami is a scratch-based image (no wget/curl/shell); -h exits 0 immediately,
      # confirming the binary is functional. HTTP endpoint cannot be checked internally.
      test: ['CMD', '/whoami', '-h']
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 2s
    restart: unless-stopped

  # Automatically updates public IP DNS in Cloudflare
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.15.1
    container_name: cloudflare-ddns
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAINS: >
        jamesmassucco.com,
        blog.jamesmassucco.com,
        oauth.jamesmassucco.com,
        assets.jamesmassucco.com,
        whoami.jamesmassucco.com,
        travel.jamesmassucco.com,
        games.jamesmassucco.com,
        tools.jamesmassucco.com,
        staging.jamesmassucco.com,
        blog-staging.jamesmassucco.com,
        travel-staging.jamesmassucco.com,
        games-staging.jamesmassucco.com,
        tools-staging.jamesmassucco.com,
        assets-staging.jamesmassucco.com,
        oauth-staging.jamesmassucco.com,
      PROXIED: true
      TZ: America/Los_Angeles
    restart: unless-stopped

networks:
  web:
    external: true
  internal_metrics:
    external: true
  socket_proxy:
    external: true
