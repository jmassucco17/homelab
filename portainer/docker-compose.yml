services:
  portainer:
    image: portainer/portainer-ce:2.45.3
    container_name: portainer
    command:
      - --http-enabled
    # Portainer needs read-write Docker API access (root-equivalent on the host), so it is
    # not routed through Traefik. It is only published on the host's loopback interface;
    # reach it over the tailnet with `tailscale serve` on the server.
    ports:
      - '127.0.0.1:9000:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # portainer image is minimal (no wget/curl/shell); --version exits 0 quickly,
      # confirming the binary is functional. The HTTP /api/system/status endpoint
      # cannot be reached from within the container without HTTP client tools.
      test: ['CMD', '/portainer', '--version']
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  portainer_data:
